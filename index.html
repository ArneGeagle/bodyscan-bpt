<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kelp · body composition platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FBFCFA;
    --bg-2: #F0F5F2;
    --bg-3: #E4EEEA;
    --card: #FFFFFF;
    --ink: #0E2A22;
    --ink-2: #4B665C;
    --ink-3: #7A9B8E;
    --line: #D8E6E0;
    --line-2: #E4EEEA;
    --mint: #3FA77F;
    --mint-deep: #1F6B4F;
    --mint-soft: #D8EFE4;
    --sand: #E5944A;
    --sand-soft: #F0E1D2;
    --good: #1F6B4F;
    --warn: #C26537;
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
    --shadow: 0 1px 0 rgba(15,42,34,0.04), 0 12px 28px -18px rgba(15,42,34,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .mf-mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "tnum" 1; font-variant-numeric: tabular-nums; }

  .mf-h1 { font-size: clamp(28px, 3.6vw, 40px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
  .mf-h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .mf-h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.005em; margin: 0 0 4px 0; }
  .mf-h3 small { color: var(--ink-3); font-weight: 500; font-size: 13px; margin-left: 4px; }
  .mf-sub { color: var(--ink-2); font-size: 14px; line-height: 1.5; margin: 4px 0 0 0; }
  .mf-lede { color: var(--ink-2); font-size: 16px; line-height: 1.5; margin: 0; }
  .mf-eyebrow { color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }

  .mf-logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
  .mf-logo-mark { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, var(--mint) 0%, var(--mint-deep) 100%); position: relative; }
  .mf-logo-mark::after { content: ""; position: absolute; inset: 5px; background: var(--bg); border-radius: 2px; }

  .mf-avatar { border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; letter-spacing: 0.02em; flex-shrink: 0; }

  /* ---- Login ---- */
  .mf-login { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 880px) {
    .mf-login { grid-template-columns: 1fr; min-height: 100vh; }
    .mf-login-aside { padding: 24px 24px 28px; gap: 18px; }
    .mf-login-aside .mf-login-pitch { margin-top: 12px; }
    .mf-login-aside .mf-h1 { font-size: 24px; }
    .mf-login-aside .mf-lede { font-size: 14px; }
    .mf-pitch-list { display: none; }
    .mf-login-stats { display: none; }
    .mf-login-main { padding: 24px; }
  }
  .mf-login-aside { background: var(--mint-deep); color: var(--bg); padding: 48px clamp(28px, 5vw, 56px); display: flex; flex-direction: column; gap: 36px; position: relative; overflow: hidden; }
  .mf-login-aside::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 80%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(63,167,127,0.4), transparent 70%); }
  .mf-login-aside .mf-logo { color: var(--bg); }
  .mf-login-aside .mf-logo-mark { background: var(--bg); }
  .mf-login-aside .mf-logo-mark::after { background: var(--mint-deep); }
  .mf-login-aside > * { position: relative; z-index: 1; }
  .mf-login-pitch { display: flex; flex-direction: column; gap: 16px; margin-top: auto; }
  .mf-login-aside .mf-h1 { color: var(--bg); font-size: clamp(32px, 4vw, 44px); }
  .mf-login-aside .mf-lede { color: rgba(255,255,255,0.78); font-size: 16px; }
  .mf-pitch-list { list-style: none; padding: 0; margin: 8px 0 0 0; display: flex; flex-direction: column; gap: 10px; }
  .mf-pitch-list li { display: flex; align-items: flex-start; gap: 12px; color: rgba(255,255,255,0.9); font-size: 14px; }
  .mf-tick { color: var(--mint-soft); font-weight: 800; }
  .mf-login-stats { display: flex; gap: 32px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.15); }
  .mf-login-stats > div { display: flex; flex-direction: column; gap: 2px; }
  .mf-login-stats b { font-size: 26px; color: var(--bg); font-weight: 700; letter-spacing: -0.02em; }
  .mf-login-stats small { color: rgba(255,255,255,0.6); font-size: 12px; }
  .mf-login-main { padding: 48px clamp(28px, 5vw, 56px); display: flex; align-items: center; justify-content: center; }
  .mf-login-card { width: min(440px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .mf-login-card .mf-h2 { margin-top: 0; }
  .mf-persona-row { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
  .mf-persona { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; text-align: left; transition: all .15s ease; }
  .mf-persona:hover { border-color: var(--mint); background: var(--bg); }
  .mf-persona > div:nth-child(2) { flex: 1; }
  .mf-persona-name { font-weight: 700; font-size: 15px; }
  .mf-persona-role { color: var(--ink-3); font-size: 12px; font-family: "JetBrains Mono", monospace; }
  .mf-kbd { padding: 2px 8px; border-radius: 6px; background: var(--bg-2); color: var(--ink-2); font-family: "JetBrains Mono", monospace; font-size: 12px; }
  .mf-divider { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .mf-divider::before, .mf-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .mf-field { display: flex; flex-direction: column; gap: 6px; }
  .mf-field > span { color: var(--ink-2); font-size: 13px; font-weight: 600; }
  .mf-field > span small { color: var(--ink-3); font-weight: 500; }
  .mf-field input, .mf-field select, .mf-textarea { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 13px; outline: none; transition: border-color .15s ease; font-size: 14px; }
  .mf-field input:focus, .mf-field select:focus, .mf-textarea:focus { border-color: var(--mint); box-shadow: 0 0 0 3px rgba(63,167,127,0.15); }
  .mf-textarea { width: 100%; font-family: inherit; resize: vertical; }
  .mf-check { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
  .mf-btn { padding: 11px 18px; border-radius: var(--r-sm); border: 1px solid transparent; cursor: pointer; font-weight: 600; font-size: 14px; transition: all .15s ease; display: inline-flex; align-items: center; gap: 6px; }
  .mf-btn-primary { background: var(--mint-deep); color: var(--bg); }
  .mf-btn-primary:hover { background: var(--mint); }
  .mf-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .mf-btn-ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
  .mf-btn-ghost:hover { background: var(--bg); border-color: var(--mint); }
  .mf-full { width: 100%; }
  .mf-back { background: none; border: 0; color: var(--ink-3); cursor: pointer; align-self: flex-start; padding: 0; font-size: 13px; margin-bottom: 8px; }
  .mf-back:hover { color: var(--ink); }

  /* ---- Shell ---- */
  .mf-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  @media (max-width: 880px) {
    .mf-shell { grid-template-columns: 1fr; }
    .mf-side { display: none; }
    .mf-mobile-top { display: flex !important; }
    .mf-mobile-nav { display: flex !important; }
    .mf-content { padding-bottom: 90px !important; padding-top: 8px !important; }
  }

  .mf-mobile-top { display: none; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line-2); position: sticky; top: 0; z-index: 20; }
  .mf-mobile-top-user { display: flex; align-items: center; gap: 10px; }
  .mf-mobile-top-name { font-weight: 700; font-size: 14px; }
  .mf-mobile-top-role { color: var(--ink-3); font-size: 11px; font-family: "JetBrains Mono", monospace; }
  .mf-mobile-top-actions { display: flex; gap: 4px; }
  .mf-mobile-top-actions button { background: var(--bg-2); border: 0; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink-2); cursor: pointer; }
  .mf-mobile-top-actions button:hover { background: var(--mint-soft); color: var(--mint-deep); }

  .mf-mobile-nav { display: none; position: fixed; bottom: 12px; left: 12px; right: 12px; background: var(--card); border-radius: 100px; box-shadow: 0 12px 30px -8px rgba(15,42,34,0.18), 0 0 0 1px var(--line-2); padding: 6px; justify-content: space-around; z-index: 30; }
  .mf-mobile-nav button { background: none; border: 0; padding: 10px 8px; border-radius: 100px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--ink-3); font-weight: 600; min-width: 56px; transition: all .15s ease; }
  .mf-mobile-nav button.is-on { background: var(--mint-deep); color: var(--bg); }
  .mf-mobile-nav button .mf-icon { width: 18px; height: 18px; }

  .mf-side { background: var(--card); border-right: 1px solid var(--line-2); padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .mf-side-logo { padding: 0 8px; display: flex; align-items: center; gap: 8px; }
  .mf-side-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .mf-side-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; background: transparent; cursor: pointer; border-radius: var(--r-sm); color: var(--ink-2); font-size: 14px; font-weight: 500; text-align: left; transition: all .12s ease; width: 100%; }
  .mf-side-link:hover { background: var(--bg-2); color: var(--ink); }
  .mf-side-link.is-on { background: var(--mint-soft); color: var(--mint-deep); font-weight: 600; }
  .mf-side-icon { width: 20px; text-align: center; display: flex; align-items: center; justify-content: center; }
  .mf-side-badge { margin-left: auto; background: var(--bg-2); color: var(--ink-2); font-size: 11px; padding: 2px 6px; border-radius: 100px; font-family: "JetBrains Mono", monospace; }
  .mf-side-link.is-on .mf-side-badge { background: var(--mint); color: var(--bg); }
  .mf-side-user { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg-2); border-radius: var(--r-md); }
  .mf-side-user-meta { flex: 1; min-width: 0; }
  .mf-side-user-name { font-weight: 700; font-size: 13px; }
  .mf-side-user-role { color: var(--ink-3); font-size: 11px; font-family: "JetBrains Mono", monospace; }
  .mf-icon-btn { background: none; border: 0; padding: 6px; cursor: pointer; color: var(--ink-3); border-radius: 6px; font-size: 14px; line-height: 1; }
  .mf-icon-btn:hover { color: var(--ink); background: var(--card); }

  .mf-content { padding: clamp(24px, 3vw, 36px); max-width: 1280px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* ---- Page header ---- */
  .mf-page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .mf-page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- Stats ---- */
  .mf-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .mf-stat { background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
  .mf-stat-label { color: var(--ink-2); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
  .mf-stat-val { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .mf-stat-val small { font-size: 14px; color: var(--ink-3); margin-left: 2px; font-weight: 600; }
  .mf-stat-delta { font-size: 12px; font-weight: 600; font-family: "JetBrains Mono", monospace; }
  .mf-stat-delta span { color: var(--ink-3); font-weight: 500; }
  .mf-stat-delta.is-good { color: var(--good); }
  .mf-stat-delta.is-warn { color: var(--warn); }

  /* ---- Panels & rows ---- */
  .mf-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  @media (max-width: 880px) { .mf-row { grid-template-columns: 1fr; } }
  .mf-panel { background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
  .mf-no-padding { padding: 0; overflow: hidden; }
  .mf-panel-head { display: flex; justify-content: space-between; align-items: baseline; }
  .mf-panel-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  .mf-note { display: flex; gap: 12px; }
  .mf-note > div:last-child { flex: 1; }
  .mf-note-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .mf-note-body { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.55; }

  .mf-coachlist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .mf-coachlist li { display: flex; align-items: center; gap: 10px; }
  .mf-coach-meta { flex: 1; min-width: 0; }
  .mf-coach-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .mf-coach-role { color: var(--ink-3); font-size: 12px; font-family: "JetBrains Mono", monospace; }
  .mf-tag { background: var(--ink); color: var(--bg); font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .mf-tag-warn { background: var(--warn); }

  /* ---- Table ---- */
  .mf-table-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  .mf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  @media (max-width: 540px) { .mf-table { min-width: 600px; } }
  .mf-table th { text-align: left; padding: 10px 14px; background: var(--bg-2); font-weight: 600; color: var(--ink-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .mf-table td { padding: 12px 14px; border-top: 1px solid var(--line-2); }
  .mf-table tbody tr:hover { background: var(--bg); }
  .mf-table th:first-child, .mf-table td:first-child { padding-left: 20px; }
  .mf-table th:last-child, .mf-table td:last-child { padding-right: 20px; }

  /* ---- Tabs ---- */
  .mf-tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 4px; align-self: flex-start; flex-wrap: wrap; }
  .mf-tab { background: none; border: 0; padding: 8px 14px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .mf-tab:hover { color: var(--ink); }
  .mf-tab.is-on { background: var(--ink); color: var(--bg); }

  .mf-chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .mf-bignum { font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; }
  .mf-bignum small { font-size: 18px; color: var(--ink-3); margin-left: 4px; font-weight: 600; }
  .mf-bigdelta { font-size: 14px; font-family: "JetBrains Mono", monospace; margin-top: 4px; }
  .mf-bigdelta .is-good { font-weight: 600; }
  .mf-chart-range { display: flex; gap: 2px; background: var(--bg-2); padding: 3px; border-radius: var(--r-sm); }
  .mf-chart-range button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--ink-2); font-family: "JetBrains Mono", monospace; }
  .mf-chart-range button.is-on { background: var(--card); color: var(--ink); font-weight: 600; }

  /* ---- Compare ---- */
  .mf-compare-pickers { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .mf-compare-pickers .mf-field { flex: 1; min-width: 200px; }
  .mf-vs { padding: 12px 4px; font-family: "JetBrains Mono", monospace; color: var(--ink-3); font-size: 13px; font-weight: 700; }
  .mf-compare-table tbody td { font-size: 14px; }
  .is-good { color: var(--good); }
  .is-warn { color: var(--warn); }

  /* ---- Goals ---- */
  .mf-goal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .mf-goal-card { flex-direction: row; align-items: center; gap: 18px; }
  .mf-goal-meta { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .mf-goal-label { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .mf-goal-row { display: flex; justify-content: space-between; font-size: 13px; }
  .mf-goal-row span:first-child { color: var(--ink-3); }
  .mf-goal-bar { height: 6px; background: var(--bg-3); border-radius: 100px; overflow: hidden; margin-top: 8px; }
  .mf-goal-bar-fill { height: 100%; background: linear-gradient(90deg, var(--mint), var(--mint-deep)); border-radius: 100px; }
  .mf-ring { position: relative; flex-shrink: 0; }
  .mf-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .mf-ring-center span { font-size: 22px; font-weight: 700; color: var(--mint-deep); }
  .mf-ring-center small { font-size: 12px; color: var(--ink-3); }

  /* ---- Roster ---- */
  .mf-roster { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 880px) { .mf-roster { grid-template-columns: 1fr; } }
  .mf-roster-list { background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 12px; box-shadow: var(--shadow); position: sticky; top: 16px; }
  .mf-roster-head { margin-bottom: 8px; position: relative; }
  .mf-search { width: 100%; padding: 9px 12px 9px 32px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); outline: none; font-size: 13px; }
  .mf-search:focus { border-color: var(--mint); }
  .mf-roster-list ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; max-height: 60vh; overflow-y: auto; }
  .mf-roster-item { display: flex; align-items: center; gap: 10px; padding: 9px; border-radius: var(--r-sm); cursor: pointer; transition: background .12s ease; }
  .mf-roster-item:hover { background: var(--bg-2); }
  .mf-roster-item.is-on { background: var(--mint-soft); }
  .mf-roster-meta { flex: 1; min-width: 0; }
  .mf-roster-name { font-weight: 600; font-size: 14px; }
  .mf-roster-sub { color: var(--ink-3); font-size: 11px; }
  .mf-roster-detail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .mf-empty { padding: 60px 32px; text-align: center; background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r-md); display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .mf-empty-emoji { font-size: 48px; line-height: 1; }
  .mf-empty .mf-sub { max-width: 36ch; }

  /* ---- New scan ---- */
  .mf-form-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
  @media (max-width: 640px) { .mf-form-row { grid-template-columns: 1fr; } }
  .mf-autofill { white-space: nowrap; }
  .mf-metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }

  /* ---- Messages ---- */
  .mf-msgs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px; }
  .mf-msgs li { display: flex; gap: 12px; }
  .mf-msgs li > div:last-child { flex: 1; }
  .mf-msg-head { display: flex; justify-content: space-between; align-items: baseline; }
  .mf-msg-body { margin: 4px 0 0 0; font-size: 14px; color: var(--ink-2); }

  .mf-toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; box-shadow: 0 16px 36px -8px rgba(0,0,0,0.25); animation: mfToast .25s ease; z-index: 50; }
  @keyframes mfToast { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- Icons ---- */
  .mf-icon { width: 18px; height: 18px; flex-shrink: 0; }

  /* Highlights card */
  .mf-highlights { background: linear-gradient(135deg, var(--mint-deep), #2D8260); color: var(--bg); border-radius: var(--r-md); padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
  .mf-highlights::before { content: ""; position: absolute; right: -40px; top: -40px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 70%); pointer-events: none; }
  .mf-highlights-head { position: relative; }

  });
  const d = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <path d={d} stroke={stroke} strokeWidth="1.5" fill="none" strokeLinecap="round" />
      {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r={i === pts.length-1 ? 3 : 1.5} fill={stroke} />)}
    </svg>
  );
}

function BigLine({ values, dates, w = 760, h = 300, goal = null, unit = "" }) {
  const pad = { t: 24, r: 24, b: 44, l: 56 };
  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const ymin = Math.min(...values, goal ?? Infinity) - 0.8;
  const ymax = Math.max(...values, goal ?? -Infinity) + 0.8;
  const span = ymax - ymin || 1;
  const xs = values.map((_, i) => pad.l + (i * innerW) / (values.length - 1));
  const ys = values.map((v) => pad.t + innerH - ((v - ymin) / span) * innerH);
  const d = xs.map((x, i) => (i === 0 ? "M" : "L") + x + "," + ys[i]).join(" ");
  const dFill = d + ` L ${xs[xs.length-1]},${pad.t+innerH} L ${xs[0]},${pad.t+innerH} Z`;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`}>
      <defs>
        <linearGradient id="mf-area" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="#3FA77F" stopOpacity="0.25" />
          <stop offset="100%" stopColor="#3FA77F" stopOpacity="0" />
        </linearGradient>
      </defs>
      {Array.from({ length: 5 }, (_, i) => {
        const y = pad.t + (i * innerH) / 4;
        const v = ymax - (i * span) / 4;
        return <g key={i}>
          <line x1={pad.l} x2={w-pad.r} y1={y} y2={y} stroke="#E4EEEA" />
          <text x={pad.l - 10} y={y + 4} textAnchor="end" fontSize="11" fill="#7A9B8E" fontFamily="JetBrains Mono">{v.toFixed(1)}</text>
        </g>;
      })}
      {goal != null && (
        <g>
          <line x1={pad.l} x2={w-pad.r}
            y1={pad.t + innerH - ((goal - ymin) / span) * innerH}
            y2={pad.t + innerH - ((goal - ymin) / span) * innerH}
            stroke="#E5944A" strokeDasharray="4 4" />
          <text x={w-pad.r} y={pad.t + innerH - ((goal - ymin) / span) * innerH - 6}
            textAnchor="end" fontSize="11" fill="#E5944A" fontFamily="JetBrains Mono">goal · {goal}{unit}</text>
        </g>
      )}
      <path d={dFill} fill="url(#mf-area)" />
      <path d={d} stroke="#3FA77F" strokeWidth="2.4" fill="none" strokeLinecap="round" strokeLinejoin="round" />
      {xs.map((x, i) => (
        <g key={i}>
          <circle cx={x} cy={ys[i]} r="4.5" fill="#FBFCFA" stroke="#3FA77F" strokeWidth="2" />
          <text x={x} y={h - 14} textAnchor="middle" fontSize="11" fill="#7A9B8E" fontFamily="JetBrains Mono">{D.fmtDate(dates[i])}</text>
        </g>
      ))}
    </svg>
  );
}

  else { status = positive ? "Moving the right way" : "Worth a chat with your coach"; statusClass = positive ? "is-good" : "is-watch"; }

  return (
    <div className="mf-stat">

        <span className="mf-sub" style={{ marginRight: 4 }}>Quick picks:</span>
        {presets.map(p => (
          <button key={p.id} className={cx("mf-preset", currentPreset === p.id && "is-on")} onClick={() => { setA(p.a); setB(p.b); }}>{p.label}</button>
        ))}
      </div>

      <div className="mf-compare-pickers">
        <label className="mf-field"><span>Baseline</span>
          <select value={a} onChange={e => setA(e.target.value)}>
            {D.scans.map(s => <option key={s.id} value={s.id}>{D.fmtDate(s.date, { long: true, year: true })}</option>)}
          </select>
        </label>
        <span className="mf-vs">VS</span>
        <label className="mf-field"><span>Comparison</span>
          <select value={b} onChange={e => setB(e.target.value)}>
            {D.scans.map(s => <option key={s.id} value={s.id}>{D.fmtDate(s.date, { long: true, year: true })}</option>)}
          </select>
        </label>
      </div>

      <div className="mf-compare-summary">
        <div className="mf-summary-item">
          <span className={cx("mf-summary-num", weightChange < 0 ? "is-good" : weightChange > 0 ? "is-warn" : "")}>{weightChange > 0 ? "+" : ""}{weightChange.toFixed(1)} kg</span>
          <span className="mf-summary-label">Weight change</span>
        </div>
        <div className="mf-summary-item">
          <span className={cx("mf-summary-num", fatChange < 0 ? "is-good" : "is-warn")}>{fatChange > 0 ? "+" : ""}{fatChange.toFixed(1)}%</span>
          <span className="mf-summary-label">Body fat change</span>
        </div>
        <div className="mf-summary-item">
          <span className={cx("mf-summary-num", muscleChange > 0 ? "is-good" : "is-warn")}>{muscleChange > 0 ? "+" : ""}{muscleChange.toFixed(1)} kg</span>
          <span className="mf-summary-label">Muscle change</span>
        </div>
      </div>

      <section className="mf-panel mf-no-padding">
        <div className="mf-table-wrap" style={{ margin: 0, padding: 0 }}>
          <table className="mf-table mf-compare-table">
            <thead>
              <tr>
                <th>Metric</th>
                <th>{D.fmtDate(sA.date, { long: true })}</th>
                <th>{D.fmtDate(sB.date, { long: true })}</th>
                <th>Change</th>
                <th>How it's going</th>
              </tr>
            </thead>
            <tbody>
              {D.metrics.map(m => {
                const va = sA[m.key], vb = sB[m.key];
                const positive = m.direction === "down" ? vb < va : vb > va;
                const flat = va === vb;
                return (
                  <tr key={m.key}>
                    <td>{m.label}</td>
                    <td className="mf-mono">{va}{m.unit}</td>
                    <td className="mf-mono">{vb}{m.unit}</td>
                    <td className={cx("mf-mono", flat ? "" : positive ? "is-good" : "is-warn")}>{D.deltaStr(vb, va, m.unit)}</td>
                    <td className={cx(flat ? "" : positive ? "is-good" : "is-warn")} style={{ fontWeight: 600 }}>
                      {flat ? "Held steady" : positive ? "Moving right way" : "Worth a chat"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </section>
    </>
  );
}

function ClientGoals() {
  const latest = D.scans[D.scans.length - 1];
  const start  = D.scans[0];
  return (
    <>
      <PageHeader title="Your goals" sub={`Set with Marcus on day one (${D.fmtDate(D.client.joined, { long: true, year: true })}). You're closer than you think.`} />
      <div className="mf-goal-grid">
        {D.metrics.filter(m => m.goalKey).map(m => {
          const curr       = latest[m.key];
          const target     = D.client.goals[m.goalKey];
          const startV     = start[m.key];
          const totalRange = Math.abs(target - startV) || 1;
          const traveled   = Math.abs(curr - startV);
          const pct        = Math.min(100, Math.max(0, (traveled / totalRange) * 100));
          const monthlyPace      = traveled / 5.6;
          const remainingDist    = Math.abs(target - curr);
          const monthsToGo       = monthlyPace > 0 ? remainingDist / monthlyPace : null;
          let encourage;
          if (pct >= 100)      encourage = "🎉 You did it! Time to set the next one.";
          else if (pct >= 75)  encourage = "Almost there — the last stretch is mostly mental.";
          else if (pct >= 50)  encourage = "Past the halfway mark. Keep going.";
          else if (pct >= 25)  encourage = "Off to a steady start. Trust the process.";
          else                 encourage = "Early days. Tiny wins compound — promise.";
          return (
            <div key={m.key} className="mf-panel mf-goal-card">
              <Ring value={pct} max={100} size={96} stroke={9} />
              <div className="mf-goal-meta">
                <div className="mf-goal-label">{m.label}</div>
                <div className="mf-goal-row"><span>Start</span><span className="mf-mono">{startV}{m.unit}</span></div>
                <div className="mf-goal-row"><span>Now</span><span className="mf-mono">{curr}{m.unit}</span></div>
                <div className="mf-goal-row"><span>Goal</span><span className="mf-mono">{target}{m.unit}</span></div>
                <div className="mf-goal-bar"><div className="mf-goal-bar-fill" style={{ width: pct + "%" }} /></div>
                {monthsToGo && pct < 100 && (
                  <div className="mf-goal-eta">At your current pace · ~{Math.ceil(monthsToGo)} months to go</div>
                )}
                <div className="mf-goal-encourage">{encourage}</div>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}
</script>

<!-- Coach views + root -->
<script type="text/babel">
function CoachApp({ onLogout }) {
  const [active, setActive] = useState("today");
  const [selectedClient, setSelectedClient] = useState("c-emma");
  const [toast, setToast] = useState("");
  const [showHelp, setShowHelp] = useState(false);
  function pingToast(msg) { setToast(msg); setTimeout(() => setToast(""), 2800); }
  const sections = [
    { id: "today",    label: "Today",    icon: "home" },
    { id: "roster",   label: "Clients",  icon: "users",  badge: D.roster.length },
    { id: "add",      label: "New scan", icon: "plus" },
    { id: "messages", label: "Messages", icon: "mail",   badge: 3 },
  ];
  return (
    <Shell role="coach" sections={sections} active={active} setActive={setActive} onLogout={onLogout} onHelp={() => setShowHelp(true)}>
      {active === "today"    && <CoachToday onOpenClient={id => { setSelectedClient(id); setActive("roster"); }} onGoto={setActive} />}
      {active === "roster"   && <CoachRoster selected={selectedClient} onSelect={setSelectedClient} onToast={pingToast} onGoto={setActive} />}
      {active === "add"      && <CoachNewScan onSaved={n => { pingToast(`✓ Saved · ${n} will see it now.`); setActive("today"); }} />}
      {active === "messages" && <CoachMessages />}
      {showHelp && <GlossaryModal onClose={() => setShowHelp(false)} />}
      {toast && <div className="mf-toast">{toast}</div>}
    </Shell>
  );
}

function CoachToday({ onOpenClient, onGoto }) {
  const today   = new Date("2026-05-22");
  const overdue = D.roster.filter(c => Math.round((today - new Date(c.lastScan)) / 86400000) > 28);
  const upcoming = D.roster.filter(c => c.nextSession !== "Overdue").slice(0, 3);
  const recent  = D.roster.filter(c => Math.round((today - new Date(c.lastScan)) / 86400000) <= 7).slice(0, 3);

  return (
    <>
      <PageHeader
        eyebrow="THURSDAY · 22 MAY 2026"
        title="Good morning, Marcus."
        sub={`${D.roster.length} active clients · ${overdue.length} overdue for a scan · ${upcoming.length} sessions on the books today.`}
        actions={<>
          <button className="mf-btn mf-btn-ghost" onClick={() => onGoto("messages")}><Icon name="mail" size={14} /> Messages</button>
          <button className="mf-btn mf-btn-primary" onClick={() => onGoto("add")}><Icon name="plus" size={14} /> Log a scan</button>
        </>}
      />

      <div className="mf-today">
        {overdue.length > 0 && (
          <div className="mf-today-card is-warn">
            <div className="mf-today-eyebrow">⚠ Needs a nudge</div>
            <div className="mf-today-title">{overdue.length} client{overdue.length === 1 ? "" : "s"} overdue</div>
            <div className="mf-today-clients">
              {overdue.map(c => {
                const days = Math.round((today - new Date(c.lastScan)) / 86400000);
                return (
                  <div key={c.id} className="mf-today-client" onClick={() => onOpenClient(c.id)}>
                    <Avatar initials={c.avatar} size={28} accent="#F5DAD0" />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600, fontSize: 13 }}>{c.name}</div>
                      <small>{days} days · last scan</small>
                    </div>
                    <Icon name="chevron" size={14} />
                  </div>
                );
              })}
            </div>
          </div>
        )}

        <div className="mf-today-card">
          <div className="mf-today-eyebrow">📅 Coming up</div>
          <div className="mf-today-title">Next sessions</div>
          <div className="mf-today-clients">
            {upcoming.map(c => (
              <div key={c.id} className="mf-today-client" onClick={() => onOpenClient(c.id)}>
                <Avatar initials={c.avatar} size={28} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{c.name}</div>
                  <small>{c.nextSession}</small>
                </div>
                <Icon name="chevron" size={14} />
              </div>
            ))}
          </div>
        </div>

        <div className="mf-today-card">
          <div className="mf-today-eyebrow">✨ Recently scanned</div>
          <div className="mf-today-title">Worth a note</div>
          <div className="mf-today-clients">
            {recent.map(c => {
              const days = Math.round((today - new Date(c.lastScan)) / 86400000);
              return (
                <div key={c.id} className="mf-today-client" onClick={() => onOpenClient(c.id)}>
                  <Avatar initials={c.avatar} size={28} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, fontSize: 13 }}>{c.name}</div>
                    <small>scanned {days === 0 ? "today" : `${days}d ago`}</small>
                  </div>
                  <Icon name="chevron" size={14} />
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <section className="mf-panel">
        <div className="mf-panel-head">
          <h2 className="mf-h3">Spotlight · Emma Larsen</h2>
          <button className="mf-btn mf-btn-ghost" onClick={() => onOpenClient("c-emma")}>Open profile →</button>
        </div>
        <p className="mf-sub" style={{ marginBottom: 12 }}>Your longest-running client. Six months in, and the numbers tell a story:</p>
        <div className="mf-highlights-grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))" }}>
          {D.metrics.slice(0, 3).map(m => {
            const series = D.scans.map(s => s[m.key]);
            return (
              <div key={m.key} className="mf-stat" style={{ padding: 14 }}>
                <div className="mf-stat-label">{m.label}</div>
                <div className="mf-stat-val mf-mono" style={{ fontSize: 22 }}>{series[series.length - 1]}<small>{m.unit}</small></div>
                <div className="mf-stat-delta is-good">{D.deltaStr(series[series.length - 1], series[0], m.unit)} <span>since start</span></div>
                <Spark values={series} />
              </div>
            );
          })}
        </div>
      </section>
    </>
  );
}

function CoachRoster({ selected, onSelect, onToast, onGoto }) {
  const [query, setQuery] = useState("");
  const filtered = D.roster.filter(c => c.name.toLowerCase().includes(query.toLowerCase()));
  return (
    <div className="mf-roster">
      <aside className="mf-roster-list">
        <div className="mf-roster-head">
          <div style={{ position: "relative" }}>
            <input className="mf-search" placeholder="Search clients…" value={query} onChange={e => setQuery(e.target.value)} />
            <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "var(--ink-3)", display: "flex" }}><Icon name="search" size={14} /></span>
          </div>
        </div>
        <ul>
          {filtered.map(c => {
            const daysSince = Math.round((new Date("2026-05-22") - new Date(c.lastScan)) / 86400000);
            const overdue   = daysSince > 28;
            return (
              <li key={c.id} className={cx("mf-roster-item", selected === c.id && "is-on")} onClick={() => onSelect(c.id)}>
                <Avatar initials={c.avatar} size={40} accent={overdue ? "#F5DAD0" : "#D8EFE4"} />
                <div className="mf-roster-meta">
                  <div className="mf-roster-name">{c.name}</div>
                  <div className="mf-roster-sub mf-mono">{daysSince}d · {c.tags[0]}</div>
                </div>
                {overdue && <span className="mf-tag mf-tag-warn">!</span>}
                <button className="mf-roster-quickadd" onClick={e => { e.stopPropagation(); onGoto("add"); }}>+ Scan</button>
              </li>
            );
          })}
        </ul>
      </aside>
      <section className="mf-roster-detail">
        <ClientDetailPane clientId={selected} onToast={onToast} />
      </section>
    </div>
  );
}

function ClientDetailPane({ clientId, onToast }) {
  const isEmma = clientId === "c-emma";
  const roster = D.roster.find(c => c.id === clientId);
  const [draft, setDraft] = useState("");

  if (!isEmma) {
    return (
      <div className="mf-empty">
        <div className="mf-empty-emoji">📋</div>
        <h2 className="mf-h2">{roster.name}'s profile</h2>
        <p className="mf-sub">Full demo data is filled in for Emma Larsen. Select her from the list to see what a complete client view looks like — scans, notes, team, the works.</p>
      </div>
    );
  }

  const latest = D.scans[D.scans.length - 1];
  const prev   = D.scans[D.scans.length - 2];
  return (
    <>
      <PageHeader
        eyebrow={`CLIENT · joined ${D.fmtDate(D.client.joined, { long: true, year: true })}`}
        title={D.client.name}
        sub={`5 scans · last on ${D.fmtDate(latest.date, { long: true })}. Down ${(D.scans[0].weightKg - latest.weightKg).toFixed(1)} kg and ${(D.scans[0].bodyFatPct - latest.bodyFatPct).toFixed(1)}% body fat since intake — well ahead of schedule.`}
        actions={<>
          <button className="mf-btn mf-btn-ghost"><Icon name="message" size={14} /> Message</button>
          <button className="mf-btn mf-btn-primary"><Icon name="plus" size={14} /> Add scan</button>
        </>}
      />

      <div className="mf-stats">
        {D.metrics.map(m => <StatCard key={m.key} metric={m} latest={latest} prev={prev} allScans={D.scans} />)}
      </div>

      <div className="mf-row">
        <section className="mf-panel mf-flex-2">
          <h2 className="mf-h3">Add a note for Emma</h2>
          <p className="mf-sub">She'll see this on her home screen. Last note shared on {D.fmtDate(latest.date, { long: true })}.</p>
          <textarea className="mf-textarea" rows="3" placeholder="What did you notice? What's next?" value={draft} onChange={e => setDraft(e.target.value)} />
          <div className="mf-panel-foot">
            <span className="mf-sub mf-mono">{draft.length} chars · {draft.length > 0 ? "she'll get a notification" : "type something to send"}</span>
            <button className="mf-btn mf-btn-primary" disabled={!draft.trim()} onClick={() => { onToast("✓ Note shared with Emma. She just got a notification."); setDraft(""); }}>Share with Emma</button>
          </div>
        </section>
        <section className="mf-panel">
          <h2 className="mf-h3">Coaching team</h2>
          <ul className="mf-coachlist">
            {D.client.coaches.map(id => {
              const c = D.coaches[id];
              return (
                <li key={id}>
                  <Avatar initials={c.avatar} size={36} accent={c.isHead ? "#F0E1D2" : "#D8EFE4"} />
                  <div className="mf-coach-meta">
                    <div className="mf-coach-name">{c.name} {c.isHead && <span className="mf-tag">Head</span>}</div>
                    <div className="mf-coach-role">{c.role}</div>
                  </div>
                </li>
              );
            })}
          </ul>
          <button className="mf-btn mf-btn-ghost mf-full" onClick={() => onToast("✓ Invite link copied. Paste it anywhere.")}>+ Invite a coach</button>
        </section>
      </div>

      <section className="mf-panel">
        <div className="mf-panel-head">
          <h2 className="mf-h3">Scan history</h2>
          <span className="mf-mono mf-sub">{D.scans.length} sessions</span>
        </div>
        <div className="mf-table-wrap">
          <table className="mf-table">
            <thead>
              <tr><th>Date</th><th>Weight</th><th>Body fat</th><th>Muscle</th><th>Visceral</th><th>Water</th><th>Met. age</th><th>Logged by</th></tr>
            </thead>
            <tbody>
              {[...D.scans].reverse().map(s => (
                <tr key={s.id}>
                  <td>{D.fmtDate(s.date, { long: true, year: true })}</td>
                  <td className="mf-mono">{s.weightKg}</td>
                  <td className="mf-mono">{s.bodyFatPct}%</td>
                  <td className="mf-mono">{s.muscleMassKg}</td>
                  <td className="mf-mono">{s.visceralFat}</td>
                  <td className="mf-mono">{s.waterPct}%</td>
                  <td className="mf-mono">{s.metabolicAge}</td>
                  <td>{D.coaches[s.coachId].firstName}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>
    </>
  );
}

function CoachNewScan({ onSaved }) {
  const [clientId, setClientId] = useState("c-emma");
  const [date, setDate] = useState("2026-05-22");
  const [vals, setVals] = useState({ weightKg: "", bodyFatPct: "", muscleMassKg: "", visceralFat: "", waterPct: "", metabolicAge: "" });
  const [note, setNote] = useState("");
  const filled    = D.metrics.every(m => vals[m.key] !== "");
  const remaining = D.metrics.filter(m => vals[m.key] === "").length;
  const clientName = D.roster.find(c => c.id === clientId).name.split(" ")[0];

  function autofill() {
    setVals({ weightKg: 66.0, bodyFatPct: 24.2, muscleMassKg: 26.6, visceralFat: 4, waterPct: 53.8, metabolicAge: 29 });
  }

  return (
    <>
      <PageHeader
        title="Log a new scan"
        sub={`60 seconds. The moment you save, ${clientName}'s home screen updates with the new numbers — and a notification.`}
      />

      <section className="mf-panel">
        <h2 className="mf-h3">Who & when</h2>
        <div className="mf-form-row">
          <label className="mf-field"><span>Client</span>
            <select value={clientId} onChange={e => setClientId(e.target.value)}>
              {D.roster.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </label>
          <label className="mf-field"><span>Scan date</span><input type="date" value={date} onChange={e => setDate(e.target.value)} /></label>
          <button type="button" className="mf-btn mf-btn-ghost mf-autofill" onClick={autofill}>
            <Icon name="download" size={14} /> Pull from device
          </button>
        </div>
        <p className="mf-sub" style={{ marginTop: 8 }}>Tip: if your scanner is paired, "Pull from device" fills everything in for you.</p>
      </section>

      <section className="mf-panel">
        <h2 className="mf-h3">Measurements <small className="mf-sub">{filled ? "all set ✓" : `${remaining} to go`}</small></h2>
        <div className="mf-metrics-grid">
          {D.metrics.map(m => (
            <label key={m.key} className="mf-field">
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                {m.label} <small className="mf-mono">{m.unit && `(${m.unit})`}</small>
                <HelpDot><strong>{m.label}</strong>{GLOSSARY[m.key].what}</HelpDot>
              </span>
              <input inputMode="decimal" placeholder="—" value={vals[m.key]} onChange={e => setVals({ ...vals, [m.key]: e.target.value })} />
            </label>
          ))}
        </div>
      </section>

      <section className="mf-panel">
        <h2 className="mf-h3">A note for {clientName} <small className="mf-sub">(optional, but appreciated)</small></h2>
        <textarea className="mf-textarea" rows="4" placeholder="What did you notice? What's the plan for next block?" value={note} onChange={e => setNote(e.target.value)} />

        {filled && (
          <div className="mf-confirm">
            <div className="mf-confirm-head"><Icon name="check" size={16} /> Ready to save</div>
            <div className="mf-confirm-grid">
              {D.metrics.map(m => (
                <div key={m.key}><small>{m.label}</small><strong>{vals[m.key]}{m.unit}</strong></div>
              ))}
            </div>
          </div>
        )}

        <div className="mf-panel-foot">
          <span className="mf-sub mf-mono">{filled ? "✓ All measurements captured" : `${remaining} field${remaining === 1 ? "" : "s"} remaining`}</span>
          <button className="mf-btn mf-btn-primary" disabled={!filled} onClick={() => onSaved(clientName)}>Save scan →</button>
        </div>
      </section>
    </>
  );
}

function CoachMessages() {
  return (
    <>
      <PageHeader title="Messages" sub="A lightweight inbox. Demo content for the prototype." />
      <section className="mf-panel">
        <ul className="mf-msgs">
          <li>
            <Avatar initials="EL" size={40} />
            <div>
              <div className="mf-msg-head"><strong>Emma Larsen</strong><span className="mf-sub mf-mono">2h ago</span></div>
              <p className="mf-msg-body">Hip mobility felt amazing this morning — Tom's sequence is working.</p>
            </div>
          </li>
          <li>
            <Avatar initials="SR" size={40} accent="#F0E1D2" />
            <div>
              <div className="mf-msg-head"><strong>Sofia Ruiz</strong><span className="mf-sub mf-mono">yesterday</span></div>
              <p className="mf-msg-body">Bumped Emma's protein target to 110g/day — can you confirm with her at the next session?</p>
            </div>
          </li>
          <li>
            <Avatar initials="JP" size={40} accent="#D5E8FF" />
            <div>
              <div className="mf-msg-head"><strong>Jonah Park</strong><span className="mf-sub mf-mono">2d ago</span></div>
              <p className="mf-msg-body">Bumping the Wednesday session — flight rescheduled. Thursday 7am OK?</p>
            </div>
          </li>
        </ul>
      </section>
    </>
  );
}

function App() {
  const [role, setRole] = useState(null);
  if (!role) return <Login onLogin={setRole} />;
  return role === "client"
    ? <ClientApp onLogout={() => setRole(null)} />
    : <CoachApp  onLogout={() => setRole(null)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
